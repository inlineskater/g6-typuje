name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp login_hero.jpg _site/login_hero.jpg
          cp -r games _site/games
          touch _site/.nojekyll
          # Stamp this build's commit SHA into the DEPLOYED page (the committed source
          # keeps the __BUILD_SHA__ placeholder) and drop a matching version.json the
          # running app polls. When a tab is left open across a later deploy, the SHA
          # baked into its page stops matching version.json and the app nudges a reload
          # instead of silently running old code. See startUpdateChecker() in index.html.
          sed -i "s|const BUILD_ID = '__BUILD_SHA__'|const BUILD_ID = '${GITHUB_SHA}'|" _site/index.html
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > _site/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      # ⚠️ If Pages deploys start failing with "Timeout reached, aborting!", do NOT
      # reach for the action's `timeout` input -- it is hard-capped at 10 min
      # (MAX_TIMEOUT in actions/deploy-pages src/internal/deployment.js), so any
      # larger value is silently clamped. On timeout the action CANCELS the
      # deployment, which poisons that commit SHA (redeploying it returns
      # "Deployment cancelled" instantly, forever) and leaves a stale record that
      # blocks other SHAs with "please cancel <sha> first". Recovery is: cancel the
      # stuck deployment via `gh api -X POST
      # repos/{owner}/{repo}/pages/deployments/{sha}/cancel`, then push a fresh SHA.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
