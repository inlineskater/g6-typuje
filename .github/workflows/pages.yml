name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # index.html grew 241 KB -> 1.88 MB between May and August 2026 without any
      # single commit looking unreasonable, until a mid-range phone needed seconds
      # of parsing before first paint. This is the ratchet that stops that happening
      # again: it fails the deploy rather than letting the page quietly get heavy.
      # When a feature genuinely belongs inline, raise the budget in the SAME commit
      # so the increase is a deliberate, reviewable decision. Otherwise the fix is to
      # move the code into tabs/*.js (see ensureTabModule) or games/*.js.
      - name: Check payload budget
        run: |
          BUDGET_KB=1600
          SIZE_KB=$(( $(wc -c < index.html) / 1024 ))
          echo "index.html: ${SIZE_KB} KB (budget ${BUDGET_KB} KB)"
          if [ "$SIZE_KB" -gt "$BUDGET_KB" ]; then
            echo "::error::index.html is ${SIZE_KB} KB, over the ${BUDGET_KB} KB budget."
            echo "Move feature code into tabs/*.js or games/*.js, or raise BUDGET_KB here deliberately."
            exit 1
          fi

      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp login_hero.jpg _site/login_hero.jpg
          cp -r games _site/games
          cp -r tabs _site/tabs
          touch _site/.nojekyll
          # Stamp this build's commit SHA into the DEPLOYED page (the committed source
          # keeps the __BUILD_SHA__ placeholder) and drop a matching version.json the
          # running app polls. When a tab is left open across a later deploy, the SHA
          # baked into its page stops matching version.json and the app nudges a reload
          # instead of silently running old code. See startUpdateChecker() in index.html.
          sed -i "s|const BUILD_ID = '__BUILD_SHA__'|const BUILD_ID = '${GITHUB_SHA}'|" _site/index.html
          printf '{"sha":"%s"}\n' "${GITHUB_SHA}" > _site/version.json

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

      # ⚠️ If Pages deploys start failing with "Timeout reached, aborting!", do NOT
      # reach for the action's `timeout` input -- it is hard-capped at 10 min
      # (MAX_TIMEOUT in actions/deploy-pages src/internal/deployment.js), so any
      # larger value is silently clamped. On timeout the action CANCELS the
      # deployment, which poisons that commit SHA (redeploying it returns
      # "Deployment cancelled" instantly, forever) and leaves a stale record that
      # blocks other SHAs with "please cancel <sha> first". Recovery is: cancel the
      # stuck deployment via `gh api -X POST
      # repos/{owner}/{repo}/pages/deployments/{sha}/cancel`, then push a fresh SHA.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
